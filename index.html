<title>Fairy Quota · 桃香莓紅版</title>
<style>
:root {
  color-scheme: dark;
  --bg: #070a12;
  --panel: #0d1422;
  --ink: #ebf4ff;
  --muted: #9baec7;
  --line: #283b55;
  --signal: #6de9fd;
  --status: #6de9fd;
  font: 15px/1.55 "Segoe UI", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 30px;
  color: var(--ink); background: radial-gradient(ellipse at 20% 15%, #17233e, transparent 46%), var(--bg);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }
.shell {
  width: min(100%, 900px); border: 1px solid var(--line); position: relative;
  background: var(--panel); box-shadow: 0 26px 90px #0008;
}
.shell::before { content: ""; position: absolute; height: 3px; width: 84px; top: -1px; left: -1px; background: var(--signal); }
header, footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 22px; }
header { border-bottom: 1px solid var(--line); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .83rem; flex-wrap: wrap; }
.brand { text-transform: uppercase; letter-spacing: .19em; font: 700 .9rem Consolas, monospace; }
.brand span { color: var(--signal); margin-right: 9px; }
.demo { color: #ffd79b; font-size: .8rem; }
.layout { display: grid; grid-template-columns: 36% 1fr; }
.core-panel {
  display: grid; align-content: center; justify-items: center; gap: 20px; padding: 32px 16px;
  border-right: 1px solid var(--line); min-height: 338px;
  background-image: linear-gradient(#2339544a 1px, transparent 1px), linear-gradient(90deg, #2339544a 1px, transparent 1px),
    radial-gradient(circle at center, #283e6a, #0b111e 69%);
  background-size: 24px 24px, 24px 24px, auto;
}
.core {
  width: 180px; background: transparent; padding: 0; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; position: relative;
  border: 1px solid #84aaff65; box-shadow: inset 0 0 24px #638aff29;
}
.core::before {
  content: ""; position: absolute; inset: 9px; border-radius: 50%;
  border: 2px solid transparent; border-top-color: #a7bbff; border-bottom-color: var(--status);
  animation: orbit 18s linear infinite;
}
.core:hover { box-shadow: inset 0 0 24px #638aff50, 0 0 22px #638aff4f; }
.core::after { content: ""; position: absolute; inset: 25px; border-radius: 50%; border: 1px dashed #9dc2ff70; }
.eye {
  width: 85px; height: 63px; border-radius: 65% 16%; transform: rotate(45deg);
  border: 1px solid #bbddff; display: grid; place-items: center;
  background: radial-gradient(circle, #657dff 0 19%, #10213d 22% 43%, #24355d 53%, #101a2b 85%);
  box-shadow: 0 0 30px #79a0ff80;
}
.eye span { width: 12px; aspect-ratio: 1; border-radius: 50%; background: var(--status); box-shadow: 0 0 18px var(--status); }
@keyframes orbit { to { transform: rotate(360deg); } }
.status { font-size: .86rem; letter-spacing: .08em; color: var(--status); }
.readout { padding: 30px 28px; min-width: 0; }
h1 { margin: 0 0 18px; font-size: 1.24rem; font-weight: 600; }
.metric { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 3px 12px; }
.metric + .metric { margin-top: 21px; }
.metric strong { font: 700 1.75rem Consolas, monospace; color: var(--signal); }
.metric.primary strong { font-size: 3rem; line-height: 1; color: var(--status); }
.reset { color: var(--muted); font-size: .81rem; }
.bar { grid-column: 1/-1; height: 11px; margin-block: 7px 2px; position: relative; background: #233044; }
.bar span { display: block; height: 100%; background: var(--signal); transition: width .3s; }
.primary .bar span { background: var(--status); }
.bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(5% - 2px), var(--panel) calc(5% - 2px) 5%); }
.controls { display: flex; gap: 7px; flex-wrap: wrap; }
.controls button { border: 1px solid var(--line); padding: 5px 10px; background: #152034; font-size: .8rem; }
.controls button:hover, .controls button[aria-pressed="true"] { color: var(--signal); border-color: var(--signal); }
[data-state="low"] { --status: #ffc880; }
[data-state="offline"] { --status: #abb0cf; }
[data-state="offline"] .bar span { opacity: .52; }
[data-state="offline"] .core::before { animation-play-state: paused; }
.compact { max-width: 440px; }
.compact .layout { grid-template-columns: 1fr; }
.compact .core-panel, .compact .secondary { display: none; }
.compact .readout { padding: 20px 22px; }
@media (max-width: 600px) {
  body { padding: 14px; }
  .layout { grid-template-columns: 1fr; }
  .core-panel { border-right: 0; border-bottom: 1px solid var(--line); min-height: 0; padding: 18px; gap: 9px; }
  .core { width: 125px; }
  .core:hover { box-shadow: inset 0 0 24px #638aff50, 0 0 22px #638aff4f; }
.core::after { inset: 17px; }
  .eye { width: 57px; height: 42px; }
  .readout { padding: 23px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }
}
:root {
  --panel: #242922;
  --ink: #f3f2e9;
  --muted: #bcc3b4;
  --line: #dce2cc29;
  --signal: #d7e5ae;
  --status: #d7e5ae;
  font-size: 16px;
}
body {
  background: radial-gradient(ellipse at 28% 15%, #353c32 0%, transparent 60%),
    radial-gradient(ellipse at 90% 80%, #292e31 0%, transparent 62%), #171b18;
}
.shell {
  overflow: hidden;
  border-radius: 38px;
  background: linear-gradient(140deg, #2f352e, #242922 78%);
  box-shadow: 0 24px 72px #10141066;
}
.shell::before { display: none; }
header, footer { padding-inline: 24px; }
.brand { letter-spacing: .13em; }
.demo {
  color: #e5e7d9;
  padding: 4px 11px;
  border-radius: 100px;
  background: #e5e7d911;
}
.layout { padding: 14px; gap: 10px; grid-template-columns: 43% minmax(0, 1fr); }
.core-panel {
  min-height: 352px;
  gap: 16px;
  padding: 24px 12px;
  border: 1px solid var(--line);
  border-radius: 29px;
  background: radial-gradient(ellipse at 50% 43%, #505b48, #363f35 45%, #2a322f 85%);
}
.core {
  width: clamp(146px, 25vw, 194px);
  border-color: #e5ead13a;
  background: repeating-radial-gradient(circle, transparent 0 13px, #dbe4c811 14px 15px),
    radial-gradient(circle, #4e5a45, #323a30 75%);
  box-shadow: 0 0 0 10px #e3e9c609, inset 0 0 25px #e3e9c618;
}
.core:hover { box-shadow: 0 0 0 10px #e3e9c612, inset 0 0 25px #e3e9c620; }
.core::before {
  inset: 8px;
  border-width: 1px;
  border-top-color: #e6e8d3a0;
  border-bottom-color: var(--status);
}
.core::after { inset: 26px; border: 1px solid #dce4cf24; pointer-events: none; }
.pick {
  display: grid;
  width: 47%;
  aspect-ratio: .88;
  place-items: center;
  position: relative;
  z-index: 1;
  border: 1px solid #f0efdf91;
  border-radius: 49% 49% 48% 48% / 42% 42% 63% 63%;
  transform: rotate(-13deg);
  background: linear-gradient(145deg, #e6e5d9, #a7b09b 55%, #777f72);
  box-shadow: 0 9px 18px #1c231b66;
}
.pick::before {
  content: "";
  width: 43%;
  height: 24%;
  border-block: 1px solid #4859418c;
  background: linear-gradient(transparent 47%, #48594183 47% 53%, transparent 53%);
}
.pick::after {
  content: "";
  position: absolute;
  width: 7px;
  aspect-ratio: 1;
  bottom: 21%;
  border-radius: 50%;
  background: var(--status);
  box-shadow: 0 0 9px var(--status);
}
.status { padding: 3px 11px; border-radius: 20px; background: #20291e62; }
.readout { padding: 22px 14px; }
.metric {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 21px;
  background: #dde1c707;
}
.metric + .metric { margin-top: 10px; }
.metric.primary strong { font-size: 2.65rem; }
.bar { height: 8px; overflow: hidden; border-radius: 20px; background: #151a16; }
.bar span { border-radius: inherit; background: linear-gradient(90deg, #83917c, var(--signal)); }
.primary .bar span { background: linear-gradient(90deg, #89978a, var(--status)); }
.bar::after { display: none; }
.controls button { border-radius: 99px; padding: 6px 12px; background: #dce8c012; }
[data-state="low"] { --status: #edc394; }
[data-state="offline"] { --status: #b5babc; }
.compact .layout { grid-template-columns: 1fr; }
.compact .readout { padding: 8px; }
@media (max-width: 600px) {
  .shell { border-radius: 28px; }
  header, footer { padding-inline: 16px; }
  .layout { grid-template-columns: 1fr; gap: 2px; }
  .core-panel { min-height: 0; padding: 21px 12px; }
  .readout { padding: 12px 0 3px; }
}
:root { --panel:#30282d; --ink:#f7edf0; --muted:#d0bec7; --line:#f1cdd728; --signal:#ecc1ce; --status:#f0becb; }
body { background: radial-gradient(ellipse at 20% 14%,#49313e,transparent 57%), radial-gradient(ellipse at 90% 90%,#303944,transparent 55%), #211c22; }
.shell { background:linear-gradient(138deg,#40303a,#2b262e 78%); }
.core-panel { background:radial-gradient(ellipse at 47% 41%,#6b4558,#4a3544 46%,#38313e 86%); }
.core { border-color:#f3d4de56; background:repeating-radial-gradient(circle,transparent 0 13px,#efd5e019 14px 15px),radial-gradient(circle,#704d61,#453342 77%); box-shadow:0 0 0 10px #eec6d20a,inset 0 0 25px #f3cddd19; }
.core:hover { box-shadow:0 0 0 10px #eec6d219,inset 0 0 25px #f3cddd2c; }
.core::before { border-top-color:#a6bac9a0; }
.core::after { border-color:#f3d4de40; }
.pick { background:linear-gradient(150deg,#f3e1df,#d6acb9 57%,#a77c94); border-color:#f4d6e2a0; }
.pick::before { display:none; }
.pick::after { bottom:13%; width:6px; }
.pick img { width:55%; height:55%; object-fit:contain; transform:rotate(13deg) translateY(-5%); filter:brightness(0) saturate(100%); opacity:.68; }
.status { background:#2d223290; }
.bar { background:#201b22; }
.bar span,.primary .bar span { background:linear-gradient(90deg,#8799ae,var(--status)); }
.controls button { background:#efe2ed13; }
.demo { color:#f1dce6; background:#ead5df16; }
.core-panel { position:relative; overflow:hidden; }
.signature { position:absolute; width:76px; max-height:35px; object-fit:contain; right:14px; bottom:12px; opacity:.63; filter:invert(1); pointer-events:none; }
.asset-credit { font-size:.72rem; color:var(--muted); }
.asset-credit summary { cursor:pointer; }
.asset-credit span { display:block; padding-top:3px; }
@media(max-width:390px) { .signature { width:56px; right:9px; bottom:8px; } }
</style>

    const percent = preview[period] + "%";
    document.querySelector("#" + period + "-value").textContent = percent;
    document.querySelector("#" + period + "-bar").style.width = percent;
  }
}

for (const button of stateButtons) {
  button.addEventListener("click", () => showPreview(button.dataset.preview));
}
const previewOrder = Object.keys(previews);
document.querySelector("#core-button").addEventListener("click", () => {
  const nextIndex = (previewOrder.indexOf(shell.dataset.state) + 1) % previewOrder.length;
  showPreview(previewOrder[nextIndex]);
});
compactButton.addEventListener("click", () => {
  const enabled = shell.classList.toggle("compact");
  compactButton.setAttribute("aria-pressed", String(enabled));
});
</script>
</html>
